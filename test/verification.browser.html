<script type="module">
  import { compatibility } from './verification/compatibility.js';
  import { performanceChecks } from './verification/performance.js';
  try {
    const comparisons = await compatibility();
    const measurements = await performanceChecks();
    window.verification = { comparisons, measurements, environment: {
      userAgent: navigator.userAgent, hardwareConcurrency: navigator.hardwareConcurrency,
      viewport: [innerWidth, innerHeight], devicePixelRatio, touchPoints: navigator.maxTouchPoints,
    } };
    document.querySelector('#report').textContent = JSON.stringify(window.verification, null, 2);
  } catch (error) {
    window.verification = { error: error.stack };
    document.querySelector('#report').textContent = error.stack;
  }
</script>
